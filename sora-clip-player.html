<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SORA Clip Player</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #17171a;
    --panel-2: #1f1f24;
    --line: #2a2a30;
    --red: #BA0C2F;
    --red-soft: #e0264a;
    --text: #f2f2f4;
    --muted: #9a9aa3;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  header h1 span { color: var(--red-soft); }
  .clip-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .source-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 10px;
    flex-wrap: wrap;
  }
  .source-bar button {
    appearance: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
  }
  .source-bar button:active { background: #2c2c33; }
  .source-bar .folder-btn {
    border-color: var(--red);
    color: var(--red-soft);
    background: rgba(186,12,47,0.10);
  }
  .source-status { font-size: 11.5px; color: var(--muted); width: 100%; padding-top: 2px; }
  .source-status strong { color: var(--text); }

  .player-wrap {
    position: relative;
    background: #000;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  video { display: block; width: 100%; max-height: 46vh; background: #000; }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    min-height: 44px;
  }
  .now-playing .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red-soft);
    flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .now-playing .dot { animation: none; } }
  .now-playing .title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-playing .idx { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .controls button {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 52px;
    cursor: pointer;
  }
  .controls button:active { background: #2c2c33; }
  .controls button.toggle.on {
    border-color: var(--red);
    color: var(--red-soft);
    background: rgba(186,12,47,0.12);
  }
  .controls button:focus-visible { outline: 2px solid var(--red-soft); outline-offset: 2px; }

  .list-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 12px 12px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 24px; font-size: 14px; line-height: 1.6; }
  .empty strong { color: var(--text); }
  .clip {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  .clip:focus-visible { outline: 2px solid var(--red-soft); outline-offset: 2px; }
  .clip.active {
    border-color: var(--red);
    background: linear-gradient(90deg, rgba(186,12,47,0.16), var(--panel) 60%);
  }
  .clip .num { flex: none; width: 26px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .clip.active .num { color: var(--red-soft); font-weight: 700; }
  .clip .meta { flex: 1; min-width: 0; }
  .clip .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip .sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .clip .remove {
    flex: none;
    appearance: none;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 8px;
  }
  .clip .remove:active { color: var(--red-soft); }

  .bottom-bar {
    display: flex;
    gap: 10px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  .bottom-bar button {
    appearance: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border-radius: 12px;
    padding: 13px 16px;
    cursor: pointer;
    border: none;
  }
  #addBtn { flex: 1; background: var(--red); color: #fff; }
  #addBtn:active { background: #9c0a27; }
  #clearBtn { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  #clearBtn:active { color: var(--text); }
  input[type="file"] { display: none; }
</style>
</head>
<body>

<header>
  <h1>SORA <span>Clip Player</span></h1>
  <div class="clip-count" id="clipCount"></div>
</header>

<div class="source-bar" id="sourceBar"></div>

<div class="player-wrap">
  <video id="player" playsinline controls preload="metadata"></video>
</div>

<div class="now-playing" id="nowPlaying" hidden>
  <div class="dot"></div>
  <div class="title" id="npTitle"></div>
  <div class="idx" id="npIdx"></div>
</div>

<div class="controls">
  <button id="prevBtn" aria-label="Previous clip">&#9198;</button>
  <button id="nextBtn" aria-label="Next clip">&#9197;</button>
  <button id="autoBtn" class="toggle" aria-pressed="false">Auto-next</button>
  <button id="loopBtn" class="toggle" aria-pressed="false">Loop clip</button>
  <button id="shuffleBtn" aria-label="Shuffle order">Shuffle</button>
</div>

<div class="list-area" id="listArea">
  <div class="empty" id="emptyMsg">
    No clips loaded yet.<br>
    <strong>Choose folder</strong> (Chrome/Edge desktop) remembers your clips folder between visits.<br>
    <strong>+ Add clips</strong> works everywhere, including iOS, but needs re-selecting each session.
  </div>
</div>

<div class="bottom-bar">
  <button id="addBtn">+ Add clips</button>
  <button id="clearBtn">Clear all</button>
</div>

<input type="file" id="fileInput" accept="video/*,.mp4,.mov,.m4v,.webm" multiple>

<script>
(function () {
  var clips = [];
  var currentIndex = -1;
  var autoNext = true;
  var loopClip = false;
  var VIDEO_EXT = /\.(mp4|mov|m4v|webm)$/i;

  var player = document.getElementById('player');
  var listArea = document.getElementById('listArea');
  var emptyMsg = document.getElementById('emptyMsg');
  var fileInput = document.getElementById('fileInput');
  var clipCount = document.getElementById('clipCount');
  var nowPlaying = document.getElementById('nowPlaying');
  var npTitle = document.getElementById('npTitle');
  var npIdx = document.getElementById('npIdx');
  var autoBtn = document.getElementById('autoBtn');
  var loopBtn = document.getElementById('loopBtn');
  var sourceBar = document.getElementById('sourceBar');

  autoBtn.classList.add('on');
  autoBtn.setAttribute('aria-pressed', 'true');

  var supportsFSA = typeof window.showDirectoryPicker === 'function';

  var DB_NAME = 'sora-clip-player';
  var STORE = 'handles';
  var dbPromise = null;

  function getDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }
  function idbSet(key, value) {
    return getDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function idbGet(key) {
    return getDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).get(key);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function fmtSize(bytes) {
    if (bytes >= 1e9) return (bytes / 1e9).toFixed(2) + ' GB';
    if (bytes >= 1e6) return (bytes / 1e6).toFixed(1) + ' MB';
    return Math.round(bytes / 1e3) + ' KB';
  }
  function fmtDur(sec) {
    if (!isFinite(sec)) return '';
    var m = Math.floor(sec / 60);
    var s = Math.round(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderList() {
    var rows = listArea.querySelectorAll('.clip');
    for (var i = 0; i < rows.length; i++) rows[i].remove();

    emptyMsg.style.display = clips.length ? 'none' : '';
    clipCount.textContent = clips.length ? clips.length + ' clip' + (clips.length === 1 ? '' : 's') : '';

    clips.forEach(function (clip, i) {
      var row = document.createElement('button');
      row.className = 'clip' + (i === currentIndex ? ' active' : '');
      row.setAttribute('data-index', i);

      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = (i === currentIndex) ? '\u25B6' : (i + 1);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = clip.name;
      var sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = fmtSize(clip.size) + (clip.duration ? ' \u00B7 ' + fmtDur(clip.duration) : '');
      meta.appendChild(name);
      meta.appendChild(sub);

      var remove = document.createElement('span');
      remove.className = 'remove';
      remove.setAttribute('data-remove', i);
      remove.setAttribute('role', 'button');
      remove.setAttribute('aria-label', 'Remove ' + clip.name);
      remove.textContent = '\u00D7';

      row.appendChild(num);
      row.appendChild(meta);
      row.appendChild(remove);
      listArea.appendChild(row);
    });
  }

  function playIndex(i) {
    if (i < 0 || i >= clips.length) return;
    currentIndex = i;
    var clip = clips[i];
    player.src = clip.url;
    player.play().catch(function () {});
    nowPlaying.hidden = false;
    npTitle.textContent = clip.name;
    npIdx.textContent = (i + 1) + ' / ' + clips.length;
    renderList();
  }
  function playNext() { if (clips.length) playIndex((currentIndex + 1) % clips.length); }
  function playPrev() { if (clips.length) playIndex((currentIndex - 1 + clips.length) % clips.length); }

  function loadDuration(clip) {
    var probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.src = clip.url;
    probe.addEventListener('loadedmetadata', function () {
      clip.duration = probe.duration;
      probe.removeAttribute('src');
      probe.load();
      renderList();
    });
  }

  function addClipFromFile(f) {
    var clip = {
      url: URL.createObjectURL(f),
      name: f.name.replace(/\.[^.]+$/, ''),
      size: f.size,
      duration: 0
    };
    clips.push(clip);
    loadDuration(clip);
    return clip;
  }

  function addFiles(fileList) {
    var startLen = clips.length;
    for (var i = 0; i < fileList.length; i++) addClipFromFile(fileList[i]);
    renderList();
    if (fileList.length && currentIndex === -1) playIndex(startLen);
  }

  function removeClip(i) {
    URL.revokeObjectURL(clips[i].url);
    var wasCurrent = (i === currentIndex);
    clips.splice(i, 1);
    if (wasCurrent) {
      player.pause();
      player.removeAttribute('src');
      player.load();
      currentIndex = -1;
      nowPlaying.hidden = true;
      if (clips.length) playIndex(Math.min(i, clips.length - 1));
    } else if (i < currentIndex) {
      currentIndex--;
    }
    renderList();
  }

  function clearAll() {
    clips.forEach(function (c) { URL.revokeObjectURL(c.url); });
    clips = [];
    currentIndex = -1;
    player.pause();
    player.removeAttribute('src');
    player.load();
    nowPlaying.hidden = true;
    renderList();
  }

  function shuffle() {
    if (clips.length < 2) return;
    var current = currentIndex >= 0 ? clips[currentIndex] : null;
    for (var i = clips.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = clips[i]; clips[i] = clips[j]; clips[j] = t;
    }
    if (current) currentIndex = clips.indexOf(current);
    renderList();
  }

  // ---- Folder connection (File System Access API — Chrome/Edge desktop only) ----
  var connectedHandle = null;

  function setSourceStatus(text) {
    var existing = sourceBar.querySelector('.source-status');
    if (existing) existing.remove();
    if (text) {
      var div = document.createElement('div');
      div.className = 'source-status';
      div.innerHTML = text;
      sourceBar.appendChild(div);
    }
  }

  async function loadFolderContents(dirHandle) {
    clearAll();
    var entries = [];
    for await (var entry of dirHandle.values()) {
      if (entry.kind === 'file' && VIDEO_EXT.test(entry.name)) entries.push(entry);
    }
    entries.sort(function (a, b) { return a.name.localeCompare(b.name); });
    for (var i = 0; i < entries.length; i++) {
      var fileHandle = entries[i];
      var f = await fileHandle.getFile();
      var clip = addClipFromFile(f);
      clip.handle = fileHandle;
    }
    renderList();
    if (clips.length) playIndex(0);
    setSourceStatus('Connected: <strong>' + dirHandle.name + '</strong> \u00B7 ' + clips.length + ' video file' + (clips.length === 1 ? '' : 's') + ' found');
  }

  async function chooseFolder() {
    try {
      var dirHandle = await window.showDirectoryPicker();
      connectedHandle = dirHandle;
      await idbSet('lastDir', dirHandle);
      await loadFolderContents(dirHandle);
      renderSourceBar();
    } catch (err) {
      if (err && err.name !== 'AbortError') {
        setSourceStatus('Could not open that folder (' + (err && err.message ? err.message : 'unknown error') + ').');
      }
    }
  }

  async function reconnectFolder(dirHandle) {
    try {
      var perm = await dirHandle.requestPermission({ mode: 'read' });
      if (perm !== 'granted') {
        setSourceStatus('Permission was not granted for the saved folder. Choose it again if needed.');
        return;
      }
      connectedHandle = dirHandle;
      await loadFolderContents(dirHandle);
      renderSourceBar();
    } catch (err) {
      setSourceStatus('Could not reconnect (' + (err && err.message ? err.message : 'unknown error') + '). Choose the folder again.');
    }
  }

  async function rescanFolder() {
    if (connectedHandle) await loadFolderContents(connectedHandle);
  }

  function renderSourceBar() {
    sourceBar.innerHTML = '';
    if (!supportsFSA) {
      setSourceStatus('Persistent folder access needs Chrome or Edge on desktop. This browser will use "+ Add clips" instead.');
      return;
    }
    var chooseBtn = document.createElement('button');
    chooseBtn.className = 'folder-btn';
    chooseBtn.textContent = connectedHandle ? 'Change folder' : 'Choose folder';
    chooseBtn.addEventListener('click', chooseFolder);
    sourceBar.appendChild(chooseBtn);

    if (connectedHandle) {
      var rescanBtn = document.createElement('button');
      rescanBtn.textContent = 'Rescan';
      rescanBtn.addEventListener('click', rescanFolder);
      sourceBar.appendChild(rescanBtn);
    }
  }

  async function init() {
    renderSourceBar();
    if (!supportsFSA) return;
    try {
      var saved = await idbGet('lastDir');
      if (saved) {
        var perm = await saved.queryPermission({ mode: 'read' });
        if (perm === 'granted') {
          connectedHandle = saved;
          await loadFolderContents(saved);
          renderSourceBar();
        } else {
          sourceBar.innerHTML = '';
          var chooseBtn = document.createElement('button');
          chooseBtn.className = 'folder-btn';
          chooseBtn.textContent = 'Choose folder';
          chooseBtn.addEventListener('click', chooseFolder);
          sourceBar.appendChild(chooseBtn);

          var reconnectBtn = document.createElement('button');
          reconnectBtn.textContent = 'Reconnect to "' + saved.name + '"';
          reconnectBtn.addEventListener('click', function () { reconnectFolder(saved); });
          sourceBar.appendChild(reconnectBtn);
        }
      }
    } catch (err) {
      // No saved handle yet, or IndexedDB unavailable — fall back silently.
    }
  }

  document.getElementById('addBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) addFiles(fileInput.files);
    fileInput.value = '';
  });
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('nextBtn').addEventListener('click', playNext);
  document.getElementById('prevBtn').addEventListener('click', playPrev);
  document.getElementById('shuffleBtn').addEventListener('click', shuffle);

  autoBtn.addEventListener('click', function () {
    autoNext = !autoNext;
    autoBtn.classList.toggle('on', autoNext);
    autoBtn.setAttribute('aria-pressed', String(autoNext));
  });
  loopBtn.addEventListener('click', function () {
    loopClip = !loopClip;
    player.loop = loopClip;
    loopBtn.classList.toggle('on', loopClip);
    loopBtn.setAttribute('aria-pressed', String(loopClip));
  });

  listArea.addEventListener('click', function (e) {
    var removeEl = e.target.closest('[data-remove]');
    if (removeEl) {
      e.stopPropagation();
      removeClip(parseInt(removeEl.getAttribute('data-remove'), 10));
      return;
    }
    var row = e.target.closest('.clip');
    if (row) playIndex(parseInt(row.getAttribute('data-index'), 10));
  });

  player.addEventListener('ended', function () {
    if (loopClip) return;
    if (autoNext && clips.length) playNext();
  });

  init();
})();
</script>
</body>
</html>
